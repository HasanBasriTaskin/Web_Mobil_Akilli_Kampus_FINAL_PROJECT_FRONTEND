name: Deploy to Production

on:
  push:
    branches:
      - hasan

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Create directories
            mkdir -p ~/MehmetFinalProje
            
            cd ~/MehmetFinalProje
            
            # Frontend: Clone or pull
            if [ -d "frontend/.git" ]; then
              cd frontend
              git fetch origin
              git reset --hard origin/hasan
            else
              rm -rf frontend
              git clone -b hasan https://${{ secrets.GH_TOKEN }}@github.com/HasanBasriTaskin/Web_Mobil_Akilli_Kampus_FINAL_PROJECT_FRONTEND.git frontend
            fi
            
            # Rebuild frontend
            cd ~/MehmetFinalProje/backend
            docker compose -f docker-compose.prod.yml up -d --build frontend