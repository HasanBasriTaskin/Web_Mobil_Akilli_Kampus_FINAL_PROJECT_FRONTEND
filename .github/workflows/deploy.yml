name: Deploy to Production

on:
  # Otomatik deploy'u şimdilik kapattık.
  # Gelecekte tekrar açmak için yorumları kaldırabilirsin:
  #
  # push:
  #   branches:
  #     - main

  # Manuel tetikleme (Actions > Deploy to Production > Run workflow)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ~/MehmetFinalProje
            cd ~/MehmetFinalProje
            
            # Frontend: Clone or pull
            if [ -d "frontend/.git" ]; then
              cd frontend
              git fetch origin
              git reset --hard origin/main
            else
              rm -rf frontend
              git clone -b main https://${{ secrets.GH_TOKEN }}@github.com/HasanBasriTaskin/Web_Mobil_Akilli_Kampus_FINAL_PROJECT_FRONTEND.git frontend
              cd frontend
            fi
            
            # Create .env.production from secrets
            cat > .env.production << EOF
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            EOF
            
            # Rebuild frontend
            cd ~/MehmetFinalProje/backend
            docker compose -f docker-compose.prod.yml up -d --build frontend
